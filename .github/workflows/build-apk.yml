name: Build Full APU Music APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      - name: Clone Real LastWave Engine
        run: |
          git clone --depth 1 https://github.com/Clash-Projects/LastWave-Native.git upstream_engine
          # Sync complete engine into workspace while preserving your branding and workflow
          cp -r upstream_engine/* .
          rm -rf upstream_engine

      - name: Apply APU Music Branding & Identity
        run: |
          # 1. Update Application ID and Name
          find . -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i 's/com.clashprojects.lastwave/com.music.apumusic/g' {} +
          find . -type f \( -name "strings.xml" \) -exec sed -i 's/>LastWave</>APU Music</g' {} +
          
          # 2. Inject Internet Permissions
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' app/src/main/AndroidManifest.xml
          fi

          # 3. Inject Apurba's Settings Footer & Quote
          find app/src/main/res/values* -name "strings.xml" -exec sed -i '/<\/resources>/i \    <string name="apu_footer_quote">People haven'\''t always been there for me, but music always has. — Taylor Swift</string>\n    <string name="apu_footer_credit">Made with love from APU</string>' {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Genuine Release/Debug APK
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload Genuine APU Music APK
        uses: actions/upload-artifact@v4
        with:
          name: APU-Music-Final-Real-APK
          path: app/build/outputs/apk/**/*.apk
