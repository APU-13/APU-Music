name: Build APU Music APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Clean Duplicate Resources
        run: |
          find app/src/main/res -name "*.png" -path "*/mipmap*/*" -delete 2>/dev/null || true
          rm -f app/src/main/res/drawable/ic_launcher_foreground.webp 2>/dev/null || true

      - name: Compile Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Package Final Clean Artifact
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/debug/*.apk release_output/APU-Music-v1.9.apk

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: APU-Music-v1.9
          path: release_output/APU-Music-v1.9.apk
